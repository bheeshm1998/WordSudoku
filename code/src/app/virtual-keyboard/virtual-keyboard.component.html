<div class="virtual-keyboard" role="group" aria-label="Virtual keyboard">
    <div class="kb-row" *ngFor="let row of rows; let rowIndex = index">
        <button *ngFor="let letter of row"
                type="button"
                class="kb-key"
                [disabled]="disabled"
                (mousedown)="onLetterClick(letter, $event)"
                (touchstart)="onLetterClick(letter, $any($event))"
                [attr.aria-label]="'Letter ' + letter">
            {{ letter }}
        </button>
        <button *ngIf="rowIndex === rows.length - 1"
                type="button"
                class="kb-key kb-key--backspace"
                [disabled]="disabled"
                (mousedown)="onBackspaceClick($event)"
                (touchstart)="onBackspaceClick($any($event))"
                aria-label="Backspace">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </button>
    </div>
</div>
