<button
    type="button"
    #cellButton
    class="cell-button"
    (click)="onClickButton($event)"
    (focus)="onCellFocus()"
    [disabled]="cellInfo.isLocked"
    [attr.aria-label]="getAriaLabel()"
    [attr.aria-disabled]="cellInfo.isLocked ? 'true' : null"
    role="gridcell"
    [ngClass]="{
        'cell-active': cellInfo.isActive,
        'cell-not-active': !cellInfo.isActive,
        'cell-locked': cellInfo.isLocked,
        'cell-user-filled': cellInfo.letter && !cellInfo.isLocked,
        'cell-conflict': cellInfo.hasConflict,
        'cell-row-highlight': cellInfo.isInSelectedRow && !cellInfo.isActive,
        'cell-col-highlight': cellInfo.isInSelectedCol && !cellInfo.isActive,
        'cell-colorblind-locked': cellInfo.isLocked && colorblindModeEnabled,
        'cell-colorblind-conflict': cellInfo.hasConflict && colorblindModeEnabled
    }"
    [ngStyle]="{'background': cellInfo.background}">
    <span class="cell-letter">{{ cellInfo.letter }}</span>
</button>
<!-- Visual indicator for colorblind mode - locked cells -->
<span *ngIf="cellInfo.isLocked && colorblindModeEnabled" class="colorblind-indicator locked-indicator" aria-hidden="true"></span>
<!-- Visual indicator for colorblind mode - conflict cells -->
<span *ngIf="cellInfo.hasConflict && colorblindModeEnabled" class="colorblind-indicator conflict-indicator" aria-hidden="true"></span>
