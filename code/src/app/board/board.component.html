<div class="game-board">

    <div class="game-header">
        <h1 class="game-title">Word Sudoku</h1>
        <p class="game-rules">
            Fill every cell so no row or column repeats a letter or spells a word in any direction.
        </p>
        <button class="stats-btn" (click)="openStats()" title="Statistics" aria-label="Open statistics">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
        </button>
        <button class="settings-btn" (click)="openSettings()" title="Settings" aria-label="Open settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>

    <div class="size-selector">
        <span class="size-label">Board Size:</span>
        <div class="size-options">
            <button *ngFor="let size of availableBoardSizes"
                    class="size-btn"
                    [class.active]="size === selectedBoardSize"
                    (click)="onBoardSizeChange(size)"
                    [attr.aria-label]="size + 'x' + size + ' board'">
                {{ size }}x{{ size }}
            </button>
        </div>
    </div>

    <div class="difficulty-selector">
        <span class="difficulty-label">Difficulty:</span>
        <div class="difficulty-options">
            <button *ngFor="let diff of availableDifficulties"
                    class="difficulty-btn"
                    [class.active]="diff === selectedDifficulty"
                    (click)="onDifficultyChange(diff)"
                    [attr.aria-label]="diff + ' difficulty'">
                {{ diff }}
            </button>
        </div>
    </div>

    <div class="timer-row">
        <div class="timer-block">
            <span class="timer-label">BEST</span>
            <span class="timer-value best-time">{{ bestScore }}</span>
            <span *ngIf="showNewBestIndicator" class="new-best-indicator">New best!</span>
        </div>
        <div class="timer-block timer-block--right">
            <span class="timer-label">TIME</span>
            <span class="timer-value current-time" [class.highlight]="showCompletionAnimation">{{ timeTaken }}</span>
        </div>
    </div>

    <div [ngClass]="'board'" [class.disable-user-action]="disableUserAction"
        [class.board-5x5]="selectedBoardSize === 5"
        [class.board-7x7]="selectedBoardSize === 7"
        [class.board-9x9]="selectedBoardSize === 9"
        [class.completion-animation]="showCompletionAnimation"
        role="grid"
        aria-label="Word Sudoku game board"
        [ngStyle]="{'grid-template-columns': gridSize}">
        <ng-container *ngFor="let row of board; index as i">
            <ng-container *ngFor="let cell of row; index as j">
                <div class="cell" [attr.data-row]="i" [attr.data-col]="j">
                    <app-cell (cellClick)="onCellClick(i, j)" [cellInfo]="board[i][j]"
                        (cellValueChange)="onCellValueChange($event, i, j)"
                        (cellFocused)="onCellFocused(i, j)">
                    </app-cell>
                </div>
            </ng-container>
        </ng-container>
        
        <!-- Confetti overlay -->
        <div class="confetti-container" *ngIf="confettiParticles.length > 0">
            <div *ngFor="let particle of confettiParticles" 
                 class="confetti-particle"
                 [ngStyle]="{
                   'left.px': particle.x,
                   'top.px': particle.y,
                   'width.px': particle.size,
                   'height.px': particle.size,
                   'background-color': particle.color,
                   'transform': 'rotate(' + particle.rotation + 'deg)',
                   'opacity': particle.life
                 }">
            </div>
        </div>
    </div>

    <div class="undo-redo-row">
        <button class="undo-redo-btn" 
                [class.disabled]="!canUndo" 
                [disabled]="!canUndo"
                (click)="performUndo()"
                title="Undo (Ctrl+Z)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7v6h6"></path>
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
            <span>Undo</span>
        </button>
        <button class="undo-redo-btn" 
                [class.disabled]="!canRedo" 
                [disabled]="!canRedo"
                (click)="performRedo()"
                title="Redo (Ctrl+Shift+Z)">
            <span>Redo</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 7v6h-6"></path>
                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
            </svg>
        </button>
    </div>

    <div class="feedback-area">
        <ng-container *ngIf="failureReason !== '' && failureDetail">
            <span class="failure-detail">{{ failureDetail }}</span>
            <button class="meaning-btn" *ngIf="failureReason === 'wordExists'" (click)="onClickSeeMeaning()">
                See meaning
            </button>
        </ng-container>
        <ng-container *ngIf="solveStatus !== '' && failureReason === ''">
            <p class="solve-status" [class.solve-status--success]="solveStatus === 'SUCCESS'">{{ solveStatus }}</p>
        </ng-container>
        <ng-container *ngIf="!assistModeEnabled && showStrictModeFeedback && allConflicts.length > 0">
            <span class="strict-mode-indicator">
                Conflict {{ currentConflictIndex + 1 }} of {{ allConflicts.length }}
            </span>
        </ng-container>
    </div>

    <button class="restart-btn" (click)="onClickRestart()" aria-label="Start new game">New Game</button>
    
    <!-- Share button - only visible after puzzle is solved -->
    <button *ngIf="solveStatus === 'SUCCESS'" class="share-btn" (click)="onClickShare()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span>Share</span>
    </button>

    <!-- Copied toast notification -->
    <div *ngIf="showCopiedToast" class="copied-toast">Copied!</div>

    <app-word-meaning [wordMeaning]="wordMeaning" (closeModal)="onCloseModal()"></app-word-meaning>
    
    <app-settings *ngIf="showSettings" (closeModal)="onCloseSettings()"></app-settings>
    
    <app-stats *ngIf="showStats" (closeModal)="onCloseStats()"></app-stats>
</div>
